<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>LeaseReputation — Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l11 5v8c0 7.5-4.7 12.7-11 15C9.7 27.7 5 22.5 5 15V7l11-5z' fill='%234F46E5'/%3E%3Cpath d='M11 16.5l3.5 3.5 6.5-7' stroke='%2334D399' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #070912;
    --glass: rgba(255,255,255,0.055);
    --glass-strong: rgba(255,255,255,0.08);
    --edge: rgba(255,255,255,0.10);
    --edge-bright: rgba(255,255,255,0.16);
    --indigo: #4F46E5;
    --indigo-hi: #6366F1;
    --indigo-soft: rgba(99,102,241,0.16);
    --lilac: #C4B5FD;
    --mint: #34D399;
    --mint-soft: rgba(52,211,153,0.13);
    --amber: #FBBF24;
    --amber-soft: rgba(251,191,36,0.11);
    --rose: #FB7185;
    --rose-soft: rgba(251,113,133,0.11);
    --text: #EAECFA;
    --muted: #8D92B8;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    background: var(--ink);
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  a { color: var(--lilac); }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; border-radius: 8px; }
  ::selection { background: rgba(99,102,241,0.45); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── ambient stage: glow orbs + dot grid, fixed behind everything ── */
  .stage { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .stage::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(196,181,253,0.075) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 0%, black 30%, transparent 100%);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; }
  .orb-1 { width: 560px; height: 560px; top: -220px; left: -140px; background: radial-gradient(circle, rgba(79,70,229,0.55), transparent 65%); }
  .orb-2 { width: 460px; height: 460px; bottom: -180px; right: -120px; background: radial-gradient(circle, rgba(52,211,153,0.28), transparent 65%); }
  .orb-3 { width: 380px; height: 380px; top: 32%; left: 58%; background: radial-gradient(circle, rgba(196,181,253,0.16), transparent 65%); }

  /* ── glass primitive ── */
  .glass {
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: var(--r-lg);
    backdrop-filter: blur(20px) saturate(1.25);
    -webkit-backdrop-filter: blur(20px) saturate(1.25);
    box-shadow:
      0 18px 44px rgba(0,0,0,0.38),
      inset 0 1px 0 rgba(255,255,255,0.09);
  }

  /* ── shell ── */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 22px 90px; }

  header.bar {
    position: sticky; top: 12px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    margin: 14px 0 6px; padding: 13px 22px;
    background: rgba(10,12,24,0.62);
    border: 1px solid var(--edge);
    border-radius: 18px;
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    box-shadow: 0 10px 34px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .wordmark { display: flex; align-items: center; gap: 11px; }
  .wordmark svg { width: 26px; height: 26px; filter: drop-shadow(0 2px 8px rgba(79,70,229,0.6)); }
  .wordmark .name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .wordmark .name em { font-style: normal; background: linear-gradient(120deg, var(--lilac), var(--indigo-hi)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wordmark .tag {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
    color: #052A1D; background: linear-gradient(135deg, var(--mint), #6EE7C4);
    border-radius: 6px; padding: 3px 8px;
    box-shadow: 0 2px 10px rgba(52,211,153,0.35);
  }
  .whoami { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }

  /* ── header nav tabs ── */
  .nav { display: flex; gap: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; }
  .nav button {
    background: none; border: none; color: var(--muted);
    font-size: 12.5px; font-weight: 800; padding: 6px 16px; border-radius: 999px;
    transition: color 0.15s, background 0.15s;
  }
  .nav button:hover { color: var(--text); }
  .nav button.on {
    color: #0B0D1A; background: linear-gradient(135deg, var(--lilac), #A78BFA);
    box-shadow: 0 3px 14px rgba(196,181,253,0.3);
  }

  /* ── users view ── */
  .users-toolbar { display: flex; gap: 10px; align-items: center; margin: 20px 0 16px; flex-wrap: wrap; }
  .users-toolbar input {
    flex: 1; min-width: 200px; padding: 11px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--edge); color: var(--text);
    font-family: inherit; font-size: 14px;
  }
  .users-toolbar input:focus { outline: none; border-color: var(--indigo-hi); box-shadow: 0 0 0 3px rgba(99,102,241,0.22); }
  .ucard { padding: 16px 20px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s; }
  .ucard:hover { border-color: var(--edge-bright); }
  .uhead { display: flex; align-items: center; gap: 14px; }
  .uavatar {
    flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
    display: grid; place-items: center; font-size: 16px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-hi));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 3px 10px rgba(79,70,229,0.35);
  }
  .uavatar img { width: 100%; height: 100%; object-fit: cover; }
  .umain { min-width: 0; flex: 1; }
  .uname { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .uemail { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .utimes { text-align: right; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.6; }
  .utimes b { color: var(--text); font-weight: 700; }
  .ubadges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .ub { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 10px; border: 1px solid transparent; }
  .ub.ok    { background: var(--mint-soft); color: var(--mint); border-color: rgba(52,211,153,0.3); }
  .ub.no    { background: rgba(255,255,255,0.04); color: var(--muted); border-color: var(--edge); }
  .ub.warn  { background: var(--amber-soft); color: var(--amber); border-color: rgba(251,191,36,0.35); }
  .ub.admin { background: var(--indigo-soft); color: var(--lilac); border-color: rgba(99,102,241,0.4); }
  .ub.off   { background: var(--rose-soft); color: var(--rose); border-color: rgba(251,113,133,0.35); }
  .udetail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07); }
  .ucard.open .udetail { display: block; }
  .udetail .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; font-size: 12.5px; }
  .udetail .kv dt { color: var(--muted); font-weight: 700; }
  .udetail .kv dd { margin: 0; word-break: break-all; }
  .udetail .kv dd.mono { font-family: var(--mono); font-size: 11.5px; }
  @media (max-width: 640px) { .utimes { display: none; } }

  .btn {
    border: 1px solid var(--edge); background: var(--glass); color: var(--text);
    border-radius: 11px; padding: 8px 15px; font-size: 13px; font-weight: 700;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background 0.16s, border-color 0.16s, transform 0.16s, box-shadow 0.16s;
  }
  .btn:hover { background: var(--glass-strong); border-color: var(--edge-bright); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: linear-gradient(135deg, var(--indigo), var(--indigo-hi));
    border-color: transparent; color: #fff;
    box-shadow: 0 6px 22px rgba(79,70,229,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-primary:hover { box-shadow: 0 8px 28px rgba(79,70,229,0.6), inset 0 1px 0 rgba(255,255,255,0.25); }
  .btn-approve {
    background: linear-gradient(135deg, var(--mint), #2BB98A);
    border-color: transparent; color: #052A1D; font-weight: 800;
    box-shadow: 0 6px 22px rgba(52,211,153,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .btn-approve:hover { box-shadow: 0 8px 30px rgba(52,211,153,0.55), inset 0 1px 0 rgba(255,255,255,0.35); }
  .btn-reject { background: rgba(251,113,133,0.07); border-color: rgba(251,113,133,0.4); color: var(--rose); }
  .btn-reject:hover { background: var(--rose-soft); border-color: rgba(251,113,133,0.65); }
  .btn[disabled] { opacity: 0.45; cursor: wait; transform: none; }

  /* ── sign-in gate ── */
  .gate-wrap { min-height: 92vh; display: grid; place-items: center; padding: 20px; }
  .gate {
    width: min(400px, 100%); padding: 38px 34px;
    animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .gate .gmark { display: flex; justify-content: center; margin-bottom: 18px; }
  .gate .gmark svg { width: 46px; height: 46px; filter: drop-shadow(0 4px 18px rgba(79,70,229,0.65)); }
  .gate h1 { font-size: 21px; font-weight: 800; text-align: center; letter-spacing: -0.02em; }
  .gate h1 em { font-style: normal; background: linear-gradient(120deg, var(--lilac), var(--indigo-hi)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gate p { color: var(--muted); font-size: 13.5px; text-align: center; margin: 6px 0 24px; }
  .gate label { display: block; font-size: 11.5px; font-weight: 800; color: var(--muted); margin: 15px 0 6px; text-transform: uppercase; letter-spacing: 0.1em; }
  .gate input {
    width: 100%; padding: 12px 14px; border-radius: var(--r-sm);
    background: rgba(255,255,255,0.05); border: 1px solid var(--edge); color: var(--text);
    font-family: inherit; font-size: 15px;
    transition: border-color 0.15s, background 0.15s;
  }
  .gate input:focus { outline: none; border-color: var(--indigo-hi); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
  .gate .btn-primary { width: 100%; margin-top: 24px; padding: 13px; font-size: 15px; }
  .gate .err { color: var(--rose); font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }

  /* ── stats ── */
  .rangebar { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 20px; }
  .rangebar span { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .rangebar button {
    background: none; border: 1px solid transparent; color: var(--muted);
    font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px;
    transition: color 0.15s, background 0.15s;
  }
  .rangebar button:hover { color: var(--text); }
  .rangebar button.on {
    color: #0B0D1A; background: linear-gradient(135deg, var(--lilac), #A78BFA);
    box-shadow: 0 3px 14px rgba(196,181,253,0.35);
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 16px 0 8px; }
  .stat {
    padding: 22px 24px; position: relative; overflow: hidden;
    transition: transform 0.18s, border-color 0.18s;
  }
  .stat:hover { transform: translateY(-2px); border-color: var(--edge-bright); }
  .stat .n {
    font-size: 40px; font-weight: 800; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .stat .l { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 4px; }
  .stat .spark { position: absolute; top: 20px; right: 22px; width: 10px; height: 10px; border-radius: 50%; }
  .stat.s-signups .spark { background: var(--lilac); box-shadow: 0 0 14px rgba(196,181,253,0.8); }
  .stat.s-reviews .spark { background: var(--indigo-hi); box-shadow: 0 0 14px rgba(99,102,241,0.8); }
  .stat.s-queue .spark { background: var(--muted); }
  .stat.queue-hot { border-color: rgba(251,191,36,0.4); }
  .stat.queue-hot .n { color: var(--amber); text-shadow: 0 0 26px rgba(251,191,36,0.45); }
  .stat.queue-hot .spark { background: var(--amber); box-shadow: 0 0 16px rgba(251,191,36,0.9); animation: pulse 1.8s ease-in-out infinite; }
  .stat.queue-hot::after {
    content: ""; position: absolute; inset: -40%;
    background: radial-gradient(circle at 82% 22%, rgba(251,191,36,0.13), transparent 42%);
    pointer-events: none;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.55; } }

  /* ── sections ── */
  section { margin-top: 38px; }
  h2.sec {
    font-size: 12.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
  }
  h2.sec .count {
    background: var(--indigo-soft); color: var(--lilac); border: 1px solid rgba(99,102,241,0.3);
    border-radius: 999px; padding: 1px 10px; font-size: 12px; letter-spacing: 0;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 22px 24px; border-style: dashed; }

  /* ── queue card ── */
  .qcard { padding: 24px 26px; margin-bottom: 18px; position: relative; overflow: hidden; }
  .qcard::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--indigo-hi), transparent);
  }
  .qcard.is-review::before { background: linear-gradient(180deg, var(--amber), transparent); }
  .qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 5px; }
  .qhead .who { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .badge {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 999px; padding: 4px 11px; border: 1px solid transparent;
  }
  .badge.pending { background: var(--indigo-soft); color: var(--lilac); border-color: rgba(99,102,241,0.35); }
  .badge.needs_review { background: var(--amber-soft); color: var(--amber); border-color: rgba(251,191,36,0.35); }
  .qmeta { font-size: 13px; color: var(--muted); }
  .qmeta b { color: var(--text); font-weight: 700; }
  .qmeta .uid { font-family: var(--mono); font-size: 11.5px; opacity: 0.8; }
  .ainotes {
    margin-top: 14px; padding: 13px 16px; border-left: 3px solid var(--amber);
    background: var(--amber-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 13.5px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .chk {
    font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 12px;
    border: 1px solid transparent;
  }
  .chk.ok  { background: var(--mint-soft); color: var(--mint); border-color: rgba(52,211,153,0.3); }
  .chk.bad { background: var(--rose-soft); color: var(--rose); border-color: rgba(251,113,133,0.3); }
  .docs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .doc {
    background: rgba(255,255,255,0.04); border: 1px solid var(--edge);
    border-radius: var(--r-md); padding: 12px;
    transition: border-color 0.16s;
  }
  .doc:hover { border-color: var(--edge-bright); }
  .doc .dl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  .doc img { width: 100%; border-radius: 9px; display: block; cursor: zoom-in; background: #000; }
  .doc .pdf, .doc .miss { display: block; padding: 28px 12px; text-align: center; font-size: 13px; color: var(--muted); }
  .decide { display: flex; align-items: center; gap: 11px; margin-top: 20px; flex-wrap: wrap; }
  .decide .btn { padding: 11px 22px; font-size: 14px; border-radius: 12px; }
  .reasonrow { display: none; width: 100%; gap: 10px; margin-top: 10px; }
  .reasonrow.open { display: flex; }
  .reasonrow input {
    flex: 1; padding: 11px 14px; border-radius: var(--r-sm);
    background: rgba(255,255,255,0.05); border: 1px solid var(--edge); color: var(--text);
    font-family: inherit; font-size: 14px;
  }
  .reasonrow input:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px rgba(251,113,133,0.2); }
  .qcard.leaving {
    opacity: 0; transform: translateY(-10px) scale(0.99);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .qresult { margin-top: 15px; font-weight: 800; font-size: 14px; }
  .qresult.ok { color: var(--mint); }
  .qresult.err { color: var(--rose); }

  /* ── feeds ── */
  .feeds { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .feed { overflow: hidden; padding: 4px 0; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px;
    transition: background 0.14s;
  }
  .row:hover { background: rgba(255,255,255,0.035); }
  .row:last-child { border-bottom: none; }
  .row .lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-hi));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 3px 10px rgba(79,70,229,0.35);
  }
  .row .main { min-width: 0; }
  .row .main .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .main .s { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row time { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .stars { color: var(--lilac); font-weight: 800; }
  .renew-no { color: var(--rose); font-weight: 800; font-size: 12px; }
  .renew-yes { color: var(--mint); font-weight: 800; font-size: 12px; }

  .notice {
    margin-top: 14px; padding: 15px 18px; border-radius: var(--r-md); font-size: 13.5px;
    background: var(--rose-soft); border: 1px solid rgba(251,113,133,0.35); word-break: break-word;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(4,5,12,0.88); display: none;
    align-items: center; justify-content: center; padding: 30px; z-index: 50; cursor: zoom-out;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 90px rgba(0,0,0,0.7); }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: rgba(20,24,48,0.75); border: 1px solid var(--edge-bright); color: var(--text);
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    opacity: 0; pointer-events: none; transition: opacity 0.22s, transform 0.22s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* entrance */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .reveal { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .reveal.d1 { animation-delay: 0.05s; } .reveal.d2 { animation-delay: 0.1s; }
  .reveal.d3 { animation-delay: 0.15s; } .reveal.d4 { animation-delay: 0.22s; }
  .reveal.d5 { animation-delay: 0.3s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 780px) {
    .stats { grid-template-columns: 1fr; }
    .feeds { grid-template-columns: 1fr; }
    .docs { grid-template-columns: 1fr; }
    .whoami span { display: none; }

    /* Header: wrap to two rows instead of forcing horizontal page scroll.
       Row 1: wordmark + sign-out. Row 2: nav tabs, full width. */
    header.bar { top: 8px; padding: 11px 14px; flex-wrap: wrap; gap: 10px; }
    .wordmark { flex: 1; min-width: 0; }
    .wordmark .name { font-size: 16px; }
    .whoami { order: 2; gap: 8px; }
    .nav { order: 3; flex-basis: 100%; justify-content: space-between; }
    .nav button { flex: 1; padding: 7px 4px; font-size: 12px; }

    .rangebar { flex-wrap: wrap; row-gap: 8px; }
    .users-toolbar { gap: 8px; }
  }

  /* Never allow anything to widen the page past the viewport. */
  html, body { max-width: 100%; overflow-x: hidden; }
  .wrap, header.bar, .glass, .qcard, .ucard { min-width: 0; max-width: 100%; box-sizing: border-box; }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

</div>

<!-- ═══ SIGN-IN GATE ═══ -->
<div id="gate" hidden>
  <div class="gate-wrap">
    <div class="gate glass">
      <div class="gmark">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M16 2l11 5v8c0 7.5-4.7 12.7-11 15C9.7 27.7 5 22.5 5 15V7l11-5z" fill="url(#gg)"/>

        </svg>
      </div>
      <h1>Lease<em>Reputation</em> admin</h1>
      <p>Sign in with an admin account to open the console.</p>
      <label for="g-email">Email</label>

      <label for="g-pass">Password</label>

</div>

<!-- ═══ DASHBOARD ═══ -->
<div id="app" class="wrap" hidden>
  <header class="bar">
    <div class="wordmark">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16 2l11 5v8c0 7.5-4.7 12.7-11 15C9.7 27.7 5 22.5 5 15V7l11-5z" fill="url(#hg)"/>
        <path d="M11 16.5l3.5 3.5 6.5-7" stroke="#34D399" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs>
      </svg>
      <div class="name">Lease<em>Reputation</em></div>
      <div class="tag">Admin</div>
    </div>
    <div class="nav" role="tablist">
      <button id="nav-overview" class="on">Overview</button>
      <button id="nav-users">Users</button>
      <button id="nav-reports">Reports</button>

    <div class="whoami">

  <div id="view-overview">
  <div class="rangebar reveal d1">

    <button data-h="48" class="on">48h</button>
    <button data-h="168">7d</button>
  </div>

  <div class="stats">
    <div class="stat glass s-signups reveal d1"><span class="spark"></span><div class="n" id="n-signups">–</div><div class="l">New signups</div></div>
    <div class="stat glass s-reviews reveal d2"><span class="spark"></span><div class="n" id="n-reviews">–</div><div class="l">New reviews</div></div>
    <div class="stat glass s-queue reveal d3" id="stat-queue"><span class="spark"></span><div class="n" id="n-queue">–</div><div class="l">Awaiting verification</div></div>
  </div>

  <section class="reveal d4">
    <h2 class="sec">Verification queue <span class="count" id="c-queue">0</span></h2>
    <div id="queue"></div>
  </section>

  <section class="reveal d5">
    <div class="feeds">
      <div>
        <h2 class="sec">Recent signups <span class="count" id="c-signups">0</span></h2>
        <div class="feed glass" id="feed-signups"></div>
      </div>
      <div>
        <h2 class="sec">Recent reviews <span class="count" id="c-reviews">0</span></h2>
        <div class="feed glass" id="feed-reviews"></div>
        <div id="reviews-notice"></div>
      </div>
    </div>
  </section>
  </div><!-- /view-overview -->

  <div id="view-users" hidden>
    <div class="users-toolbar reveal d1">
      <input id="u-search" type="search" placeholder="Filter by name, email, phone, location, community, or uid…" />
      <button id="u-refresh" class="btn">Refresh</button>
    </div>
    <h2 class="sec reveal d1">All users <span class="count" id="c-users">0</span></h2>
    <div id="users-list"></div>
  </div><!-- /view-users -->

  <div id="view-reports" hidden>
    <div class="users-toolbar reveal d1">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700;">
        <input type="checkbox" id="r-show-resolved" style="accent-color:#6366F1;" /> Show resolved
      </label>
      <span style="flex:1"></span>
      <button id="r-refresh" class="btn">Refresh</button>
    </div>
    <h2 class="sec reveal d1">Review reports <span class="count" id="c-reports">0</span></h2>
    <div id="reports-list"></div>
  </div><!-- /view-reports -->

  <div id="view-claims" hidden>
    <div class="users-toolbar reveal d1">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700;">
        <input type="checkbox" id="cl-show-decided" style="accent-color:#6366F1;" /> Show decided
      </label>
      <span style="flex:1"></span>
      <button id="cl-refresh" class="btn">Refresh</button>
    </div>
    <h2 class="sec reveal d1">Community claims <span class="count" id="c-claims">0</span></h2>
    <div id="claims-list"></div>
  </div><!-- /view-claims -->
</div>

<div class="lightbox" id="lightbox"><img alt="Verification document, enlarged" /></div>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, collectionGroup, query, where, orderBy, limit,
  getDocs, getDoc, doc, updateDoc, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref, listAll, getDownloadURL, getMetadata
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {
  getFunctions, httpsCallable
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLuNfzCLSknRBRZOO4DZzA8_kawYrzQtI",
  authDomain: "lease-reputation.firebaseapp.com",
  projectId: "lease-reputation",
  storageBucket: "lease-reputation.firebasestorage.app",
  messagingSenderId: "965994935324",
  appId: "1:965994935324:web:71879fcb84b831d4a35bd9",
  measurementId: "G-LCTV224DYX"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const decide = httpsCallable(getFunctions(app, "us-central1"), "adminDecideVerification");
const listUsersFn = httpsCallable(getFunctions(app, "us-central1"), "adminListUsers");
const decideClaimFn = httpsCallable(getFunctions(app, "us-central1"), "adminDecideClaim");

const $ = (id) => document.getElementById(id);
let windowHours = 48;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── helpers ── */
const toast = (msg) => {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ago = (d) => {
  if (!d) return "";
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const tsToDate = (t) => (t && t.toDate ? t.toDate() : null);
const cutoffTs = () => Timestamp.fromMillis(Date.now() - windowHours * 3600 * 1000);
const initials = (name) => {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0] || "?") + (parts[1]?.[0] || "")).toUpperCase();
};

/* count-up stat animation */
function setStat(id, value) {
  const el = $(id);
  if (typeof value !== "number" || REDUCED) { el.textContent = value; return; }
  const from = 0, dur = 550, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (value - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ── auth gate ── */
onAuthStateChanged(auth, async (user) => {
  if (!user) { $("app").hidden = true; $("gate").hidden = false; return; }
  const tok = await user.getIdTokenResult(true); // force refresh — picks up fresh claims
  const isAdmin = tok.claims.admin === true || tok.claims.role === "admin";
  if (!isAdmin) {
    await signOut(auth);
    $("g-err").textContent = "That account isn't an admin.";
    return;
  }
  $("gate").hidden = true;
  $("app").hidden = false;
  $("who").textContent = user.email;
  loadAll();
});

$("g-go").addEventListener("click", signIn);
$("g-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
async function signIn() {
  $("g-err").textContent = "";
  const btn = $("g-go");
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $("g-email").value.trim(), $("g-pass").value);
  } catch (e) {
    $("g-err").textContent =
      e.code === "auth/invalid-credential" ? "Wrong email or password."
      : "Sign-in failed: " + (e.code || e.message);
  } finally { btn.disabled = false; }
}
$("signout").addEventListener("click", () => signOut(auth));

/* ── range selector ── */
document.querySelectorAll(".rangebar button").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".rangebar button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    windowHours = Number(b.dataset.h);
    loadSignups();
    loadReviews();
  })
);

function loadAll() { loadSignups(); loadReviews(); loadQueue(); }

/* ── signups feed ── */
async function loadSignups() {
  const feed = $("feed-signups");
  feed.innerHTML = "";
  try {
    const snap = await getDocs(query(
      collection(db, "users"),
      where("createdAt", ">=", cutoffTs()),
      orderBy("createdAt", "desc"),
      limit(50)
    ));
    setStat("n-signups", snap.size);
    $("c-signups").textContent = snap.size;
    if (snap.empty) { feed.innerHTML = `<div class="row"><div class="main"><div class="s">No signups in this window.</div></div></div>`; return; }
    snap.forEach((d) => {
      const u = d.data();
      const flags = [
        u.identityVerified ? "verified" : "unverified",
        u.phone ? "" : "no phone",
      ].filter(Boolean).join(" · ");
      feed.insertAdjacentHTML("beforeend", `
        <div class="row">
          <div class="lead">
            <div class="avatar">${esc(initials(u.name))}</div>
            <div class="main">
              <div class="t">${esc(u.name || "(no name)")}</div>
              <div class="s">${esc(flags)}</div>
            </div>
          </div>
          <time>${ago(tsToDate(u.createdAt))}</time>
        </div>`);
    });
  } catch (e) {
    $("n-signups").textContent = "!";
    feed.innerHTML = `<div class="row"><div class="main"><div class="s">Couldn't load signups: ${esc(e.message)}</div></div></div>`;
  }
}

/* ── reviews feed (collection-group) ── */
async function loadReviews() {
  const feed = $("feed-reviews");
  const notice = $("reviews-notice");
  feed.innerHTML = ""; notice.innerHTML = "";
  try {
    const snap = await getDocs(query(
      collectionGroup(db, "reviews"),
      where("createdAt", ">=", cutoffTs()),
      orderBy("createdAt", "desc"),
      limit(50)
    ));
    setStat("n-reviews", snap.size);
    $("c-reviews").textContent = snap.size;
    if (snap.empty) { feed.innerHTML = `<div class="row"><div class="main"><div class="s">No reviews in this window.</div></div></div>`; return; }
    for (const d of snap.docs) {
      const r = d.data();
      const stars = r.ratings
        ? (Object.values(r.ratings).reduce((a, b) => a + b, 0) / Object.keys(r.ratings).length).toFixed(1)
        : "–";
      let communityName = r.communityId || "";
      try {
        const c = await getDoc(doc(db, "communities", r.communityId));
        if (c.exists()) communityName = c.data().name || communityName;
      } catch (_) {}
      feed.insertAdjacentHTML("beforeend", `
        <div class="row">
          <div class="main">
            <div class="t"><span class="stars">★ ${esc(stars)}</span> &nbsp;${esc(communityName)}</div>
            <div class="s">${esc(r.authorName || "")} · ${esc(r.residentStatus || "")} ·
              <span class="${r.wouldRenew ? "renew-yes" : "renew-no"}">${r.wouldRenew ? "would renew" : "would not renew"}</span></div>
          </div>
          <time>${ago(tsToDate(r.createdAt))}</time>
        </div>`);
    }
  } catch (e) {
    $("n-reviews").textContent = "!";
    if (e.code === "failed-precondition" && /index/i.test(e.message)) {
      const link = (e.message.match(/https:\/\/\S+/) || [""])[0];
      notice.innerHTML = `<div class="notice">First run: Firestore needs a one-time index for the cross-community reviews query.
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Click here to create it</a> (takes ~1 min to build), then reload.` : "Open the browser console for the creation link."}</div>`;
    } else {
      notice.innerHTML = `<div class="notice">Couldn't load reviews: ${esc(e.message)}</div>`;
    }
  }
}

/* ── verification queue ── */
async function loadQueue() {
  const wrapEl = $("queue");
  wrapEl.innerHTML = "";
  try {
    const snap = await getDocs(query(
      collection(db, "verifications"),
      where("status", "in", ["pending", "needs_review"])
    ));
    const items = snap.docs
      .map((d) => ({ uid: d.id, ...d.data() }))
      .sort((a, b) => (tsToDate(b.submittedAt)?.getTime() || 0) - (tsToDate(a.submittedAt)?.getTime() || 0));
    setStat("n-queue", items.length);
    $("c-queue").textContent = items.length;
    $("stat-queue").classList.toggle("queue-hot", items.length > 0);
    if (!items.length) {
      wrapEl.innerHTML = `<div class="empty glass">Queue is empty. Nothing waiting on you. 🎉</div>`;
      return;
    }
    for (const v of items) renderQueueCard(wrapEl, v);
  } catch (e) {
    wrapEl.innerHTML = `<div class="notice">Couldn't load the queue: ${esc(e.message)}</div>`;
  }
}

/* Decided cards linger 2s so the outcome is readable, then fade away. */
function retireCard(card) {
  setTimeout(() => {
    card.classList.add("leaving");
    setTimeout(() => {
      card.remove();
      if (!document.querySelector("#queue .qcard")) {
        $("queue").innerHTML = `<div class="empty glass">Queue is empty. Nothing waiting on you. 🎉</div>`;
      }
    }, 480);
  }, 2000);
}

const CHECK_LABELS = {
  idName: "ID name", resName: "Residency name", resAddress: "Address",
  resCurrent: "Current", legible: "Legible",
};

async function renderQueueCard(container, v) {
  const card = document.createElement("div");
  card.className = "qcard glass reveal" + (v.status === "needs_review" ? " is-review" : "");
  card.dataset.uid = v.uid;

  let userName = "";
  try {
    const u = await getDoc(doc(db, "users", v.uid));
    if (u.exists()) userName = u.data().name || "";
  } catch (_) {}

  const checksHtml = v.aiChecks
    ? `<div class="checks">${Object.entries(v.aiChecks).map(([k, ok]) =>
        `<span class="chk ${ok ? "ok" : "bad"}">${ok ? "✓" : "✕"} ${esc(CHECK_LABELS[k] || k)}</span>`).join("")}</div>`
    : "";

  card.innerHTML = `
    <div class="qhead">
      <span class="who">${esc(userName || "(no name on file)")}</span>
      <span class="badge ${esc(v.status)}">${esc(v.status.replace("_", " "))}</span>
    </div>
    <div class="qmeta">
      <b>${esc(v.communityName || v.communityId || "unknown community")}</b>
      &nbsp;·&nbsp; submitted ${esc(ago(tsToDate(v.submittedAt)) || "—")}
      &nbsp;·&nbsp; <span class="uid">${esc(v.uid)}</span>
    </div>
    ${v.aiNotes ? `<div class="ainotes"><b>AI notes:</b> ${esc(v.aiNotes)}</div>` : ""}
    ${checksHtml}
    <div class="docs"></div>
    <div class="decide">
      <button class="btn btn-approve">Approve</button>
      <button class="btn btn-reject">Reject…</button>
      <div class="reasonrow">
        <input type="text" maxlength="300" placeholder="Reason shown to the user (e.g. “ID photo is too blurry to read — please retake it.”)" />
        <button class="btn btn-reject confirm">Send rejection</button>
      </div>
    </div>
    <div class="qresult"></div>`;
  container.appendChild(card);

  // ── docs ──
  const docsEl = card.querySelector(".docs");
  try {
    const listing = await listAll(ref(storage, `verification-docs/${v.uid}`));
    if (!listing.items.length) {
      docsEl.innerHTML = `<div class="doc"><span class="miss">No documents in storage — likely already cleaned up or never uploaded. Reject with a resubmission note.</span></div>`;
    } else {
      for (const item of listing.items) {
        const box = document.createElement("div");
        box.className = "doc";
        const label = item.name.startsWith("id") ? "Photo ID" : item.name.startsWith("res") ? "Proof of residency" : item.name;
        box.innerHTML = `<div class="dl">${esc(label)}</div><span class="miss">Loading…</span>`;
        docsEl.appendChild(box);
        try {
          const [url, meta] = await Promise.all([getDownloadURL(item), getMetadata(item)]);
          if ((meta.contentType || "").includes("pdf")) {
            box.querySelector(".miss").outerHTML =
              `<a class="pdf" href="${esc(url)}" target="_blank" rel="noopener">Open PDF ↗</a>`;
          } else {
            box.querySelector(".miss").outerHTML =
              `<img src="${esc(url)}" alt="${esc(label)}" loading="lazy" />`;
            box.querySelector("img").addEventListener("click", () => {
              const lb = $("lightbox");
              lb.querySelector("img").src = url;
              lb.classList.add("open");
            });
          }
        } catch (e) {
          box.querySelector(".miss").textContent = "Couldn't load: " + (e.code || e.message);
        }
      }
    }
  } catch (e) {
    docsEl.innerHTML = `<div class="doc"><span class="miss">Storage error: ${esc(e.code || e.message)}</span></div>`;
  }

  // ── decisions ──
  const btnApprove = card.querySelector(".btn-approve");
  const btnReject = card.querySelector(".btn-reject:not(.confirm)");
  const reasonRow = card.querySelector(".reasonrow");
  const reasonInput = reasonRow.querySelector("input");
  const btnConfirm = reasonRow.querySelector(".confirm");
  const result = card.querySelector(".qresult");
  const busy = (on) => [btnApprove, btnReject, btnConfirm].forEach((b) => (b.disabled = on));

  btnApprove.addEventListener("click", async () => {
    if (!confirm(`Approve ${userName || v.uid} for ${v.communityName || v.communityId}?\n\nThis sets their verified claims, records the residency, and permanently deletes their documents.`)) return;
    busy(true);
    try {
      await decide({ uid: v.uid, decision: "approve" });
      result.className = "qresult ok";
      result.textContent = "Approved — claims set, residency recorded, documents deleted.";
      card.querySelector(".decide").remove();
      toast("Verification approved");
      bumpQueueCount(-1);
      retireCard(card);
    } catch (e) {
      result.className = "qresult err";
      result.textContent = "Approve failed: " + (e.message || e.code);
      busy(false);
    }
  });

  btnReject.addEventListener("click", () => {
    reasonRow.classList.toggle("open");
    if (reasonRow.classList.contains("open")) reasonInput.focus();
  });

  btnConfirm.addEventListener("click", async () => {
    const reason = reasonInput.value.trim();
    if (!reason) { reasonInput.focus(); return; }
    busy(true);
    try {
      await decide({ uid: v.uid, decision: "reject", reason });
      result.className = "qresult ok";
      result.textContent = "Rejected — user sees your reason and can resubmit. Documents deleted.";
      card.querySelector(".decide").remove();
      toast("Verification rejected");
      bumpQueueCount(-1);
      retireCard(card);
    } catch (e) {
      result.className = "qresult err";
      result.textContent = "Reject failed: " + (e.message || e.code);
      busy(false);
    }
  });
}

function bumpQueueCount(d) {
  const n = Math.max(0, Number($("n-queue").textContent) + d);
  $("n-queue").textContent = n;
  $("c-queue").textContent = n;
  $("stat-queue").classList.toggle("queue-hot", n > 0);
}

/* ── Users tab ── */
let _users = null; // cache for the session

$("nav-overview").addEventListener("click", () => switchView("overview"));
$("nav-users").addEventListener("click", () => switchView("users"));
$("nav-reports").addEventListener("click", () => switchView("reports"));
$("nav-claims").addEventListener("click", () => switchView("claims"));
function switchView(v) {
  $("nav-overview").classList.toggle("on", v === "overview");
  $("nav-users").classList.toggle("on", v === "users");
  $("nav-reports").classList.toggle("on", v === "reports");
  $("nav-claims").classList.toggle("on", v === "claims");
  $("view-overview").hidden = v !== "overview";
  $("view-users").hidden = v !== "users";
  $("view-reports").hidden = v !== "reports";
  $("view-claims").hidden = v !== "claims";
  if (v === "users" && _users === null) loadUsers();
  if (v === "reports" && _reports === null) loadReports();
  if (v === "claims" && _claims === null) loadClaims();
}

/* ── Claims tab ── */
let _claims = null;
const REC_STYLE = {
  "approve":      "background:rgba(52,211,153,0.15);color:#34D399;border:1px solid rgba(52,211,153,0.4)",
  "lean-approve": "background:rgba(52,211,153,0.10);color:#6EE7B7;border:1px solid rgba(52,211,153,0.3)",
  "review":       "background:rgba(251,191,36,0.12);color:#FBBF24;border:1px solid rgba(251,191,36,0.35)",
  "lean-reject":  "background:rgba(248,113,113,0.12);color:#F87171;border:1px solid rgba(248,113,113,0.35)",
};

$("cl-refresh").addEventListener("click", () => loadClaims(true));
$("cl-show-decided").addEventListener("change", () => renderClaims());

async function loadClaims(force = false) {
  const list = $("claims-list");
  if (_claims !== null && !force) { renderClaims(); return; }
  list.innerHTML = `<div class="empty glass">Loading claims…</div>`;
  try {
    const snap = await getDocs(query(
      collection(db, "claimRequests"), orderBy("createdAt", "desc"), limit(100)
    ));
    _claims = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderClaims();
  } catch (e) {
    list.innerHTML = `<div class="notice">Couldn't load claims: ${esc(e.message || e.code)}</div>`;
  }
}

function renderClaims() {
  const list = $("claims-list");
  const showDecided = $("cl-show-decided").checked;
  const rows = (_claims || []).filter((c) => showDecided || c.status === "pending");
  $("c-claims").textContent = rows.length;
  if (!rows.length) {
    list.innerHTML = `<div class="empty glass">${showDecided ? "No claims yet." : "No pending claims. 🎉"}</div>`;
    return;
  }
  list.innerHTML = "";
  for (const c of rows) list.appendChild(claimCard(c));
}

function claimCard(c) {
  const card = document.createElement("div");
  card.className = "glass";
  card.style.cssText = "padding:16px;margin-bottom:12px;border-radius:14px;";
  const s = c.screening || {};
  const ai = s.ai || {};
  const rec = s.recommendation || "";
  const recChip = rec
    ? `<span style="display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;${REC_STYLE[rec] || REC_STYLE["review"]}">${esc(rec)}</span>`
    : `<span style="color:var(--muted);font-size:11.5px;">not screened</span>`;
  const domLine = s.emailDomain
    ? `${s.domainMatch ? "✅" : "⚠️"} Domain: <b>${esc(s.emailDomain)}</b> vs <b>${esc(s.communityDomain || "no website found")}</b>${s.freeEmail ? " (free-mail ⚠️)" : ""}`
    : "";
  const aiLine = ai.ran
    ? `${["high","medium"].includes(ai.confidence) ? "✅" : "⚠️"} Document read — confidence <b>${esc(ai.confidence)}</b><br/><span style="color:var(--muted);">${esc(ai.findings || "")}</span>`
    : `⚠️ Document not auto-read${ai.error ? ` <span style="color:var(--muted);">(${esc(ai.error)})</span>` : ""}`;
  const decided = c.status !== "pending";
  card.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
      <div>
        <div style="font-weight:800;font-size:15px;">${esc(c.communityName || c.communityId)}</div>
        <div style="color:var(--muted);font-size:12.5px;">${esc(c.communityAddress || "")}</div>
      </div>
      <div>${decided ? `<span style="color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;">${esc(c.status)}</span>` : recChip}</div>
    </div>
    <div style="margin-top:10px;font-size:13px;line-height:1.7;">
      <b>${esc(c.claimantName || "?")}</b> — ${esc(c.role || "?")} · ${esc(c.company || "?")}<br/>
      <span style="color:var(--muted);">${esc(c.workEmail || "?")}${c.phone ? " · " + esc(c.phone) : ""}</span>
    </div>
    ${(domLine || aiLine) ? `<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--edge);font-size:12.5px;line-height:1.7;">${domLine}${domLine ? "<br/>" : ""}${aiLine}</div>` : ""}
    <div class="cl-evidence" style="margin-top:10px;font-size:12.5px;color:var(--muted);">Evidence: loading…</div>
    ${decided ? (c.decisionNote ? `<div style="margin-top:8px;font-size:12.5px;color:var(--muted);">Note: ${esc(c.decisionNote)}</div>` : "") : `
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn cl-approve" style="background:rgba(52,211,153,0.15);border-color:rgba(52,211,153,0.4);color:#34D399;">Approve</button>
      <button class="btn cl-reject" style="background:rgba(248,113,113,0.10);border-color:rgba(248,113,113,0.35);color:#F87171;">Reject</button>
      <span class="cl-status" style="align-self:center;font-size:12.5px;color:var(--muted);"></span>
    </div>`}
  `;
  // Evidence link (deleted after decisions, per the privacy promise).
  const evEl = card.querySelector(".cl-evidence");
  if (c.evidencePath && !decided) {
    getDownloadURL(ref(storage, c.evidencePath))
      .then((url) => { evEl.innerHTML = `Evidence: <a href="${url}" target="_blank" rel="noopener" style="color:#A5B4FC;font-weight:700;">open document ↗</a>`; })
      .catch(() => { evEl.textContent = "Evidence: unavailable."; });
  } else {
    evEl.textContent = decided ? "Evidence: deleted after decision (privacy policy)." : "Evidence: none attached.";
  }
  if (!decided) {
    const statusEl = card.querySelector(".cl-status");
    const doDecide = async (decision) => {
      let note;
      if (decision === "reject") {
        note = prompt("Optional note to the claimant (goes in their email):") || undefined;
      }
      card.querySelectorAll("button").forEach((b) => (b.disabled = true));
      statusEl.textContent = decision === "approve" ? "Approving…" : "Rejecting…";
      try {
        await decideClaimFn({ requestId: c.id, decision, note });
        c.status = decision === "approve" ? "approved" : "rejected";
        if (note) c.decisionNote = note;
        renderClaims();
      } catch (e) {
        statusEl.textContent = e.message || e.code || "Failed.";
        card.querySelectorAll("button").forEach((b) => (b.disabled = false));
      }
    };
    card.querySelector(".cl-approve").addEventListener("click", () => doDecide("approve"));
    card.querySelector(".cl-reject").addEventListener("click", () => doDecide("reject"));
  }
  return card;
}

/* ── Reports tab ── */
let _reports = null;
const REASON_LABELS = {
  fake: "Fake / spam", harassment: "Harassment", privacy: "Private info",
  offtopic: "Off-topic", other: "Other",
};

$("r-refresh").addEventListener("click", () => loadReports(true));
$("r-show-resolved").addEventListener("change", () => renderReports());

async function loadReports(force = false) {
  const list = $("reports-list");
  if (_reports !== null && !force) { renderReports(); return; }
  list.innerHTML = `<div class="empty glass">Loading reports…</div>`;
  try {
    const snap = await getDocs(query(
      collection(db, "reports"), orderBy("createdAt", "desc"), limit(100)
    ));
    _reports = [];
    for (const d of snap.docs) {
      const r = { id: d.id, ...d.data() };
      // Pull the reported review + community name for context.
      try {
        const [rev, com] = await Promise.all([
          getDoc(doc(db, "communities", r.communityId, "reviews", r.reviewId)),
          getDoc(doc(db, "communities", r.communityId)),
        ]);
        r._review = rev.exists() ? rev.data() : null;
        r._communityName = com.exists() ? (com.data().name || r.communityId) : r.communityId;
      } catch (_) { r._review = null; r._communityName = r.communityId; }
      _reports.push(r);
    }
    renderReports();
  } catch (e) {
    list.innerHTML = `<div class="notice">Couldn't load reports: ${esc(e.message || e.code)}</div>`;
  }
}

function renderReports() {
  const list = $("reports-list");
  const showResolved = $("r-show-resolved").checked;
  const rows = (_reports || []).filter((r) => showResolved || r.status === "new");
  $("c-reports").textContent = rows.length;
  if (!rows.length) {
    list.innerHTML = `<div class="empty glass">${showResolved ? "No reports yet." : "No open reports. 🎉"}</div>`;
    return;
  }
  list.innerHTML = "";
  for (const r of rows) list.appendChild(reportCard(r));
}

function reportCard(r) {
  const card = document.createElement("div");
  card.className = "qcard glass" + (r.status === "new" ? " is-review" : "");
  const rev = r._review;
  const revGone = !rev;
  const hidden = rev && rev.hidden === true;
  const stars = rev && rev.ratings
    ? (Object.values(rev.ratings).reduce((a, b) => a + b, 0) / Object.keys(rev.ratings).length).toFixed(1)
    : "–";
  const statusBadge = r.status === "new"
    ? '<span class="badge needs_review">open</span>'
    : `<span class="badge pending">${esc(r.status)}</span>`;
  card.innerHTML = `
    <div class="qhead">
      <span class="who">${esc(REASON_LABELS[r.reason] || r.reason)}</span>
      ${statusBadge}
      ${hidden ? '<span class="ub off">REVIEW HIDDEN</span>' : ""}
    </div>
    <div class="qmeta">
      <b>${esc(r._communityName)}</b> &nbsp;·&nbsp; reported ${esc(ago(tsToDate(r.createdAt)) || "—")}
      &nbsp;·&nbsp; reporter <span class="uid">${esc(r.reportedBy || "?")}</span>
    </div>
    ${r.detail ? `<div class="ainotes"><b>Reporter says:</b> ${esc(r.detail)}</div>` : ""}
    ${revGone
      ? `<div class="ainotes" style="border-color:var(--rose);background:var(--rose-soft);"><b>Review no longer exists</b> — deleted by its author or an admin.</div>`
      : `<div style="margin-top:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--edge);">
           <div style="font-size:13px;font-weight:800;">${esc(rev.authorName || "Verified resident")} &nbsp;<span class="stars">★ ${esc(stars)}</span>
             &nbsp;<span style="color:var(--muted);font-weight:600;font-size:12px;">${esc(rev.residentStatus || "")}${rev.wouldRenew === false ? " · would not renew" : ""}</span></div>
           ${rev.text ? `<div style="margin-top:8px;font-size:13.5px;line-height:1.55;color:var(--muted);white-space:pre-wrap;">${esc(rev.text)}</div>` : '<div style="margin-top:8px;font-size:12.5px;color:var(--muted);">(no written text — ratings only)</div>'}
           ${Array.isArray(rev.photos) && rev.photos.length ? `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">${rev.photos.map((p) => `<img src="${esc(p)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;" onclick="document.getElementById('lightbox').querySelector('img').src='${esc(p)}';document.getElementById('lightbox').classList.add('open');" />`).join("")}</div>` : ""}
         </div>`}
    <div class="decide"></div>
    <div class="qresult"></div>`;

  const actions = card.querySelector(".decide");
  const result = card.querySelector(".qresult");
  const btn = (label, cls, fn) => {
    const b = document.createElement("button");
    b.className = "btn " + cls;
    b.textContent = label;
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await fn(); }
      catch (e) {
        result.className = "qresult err";
        result.textContent = "Action failed: " + (e.message || e.code);
        b.disabled = false;
      }
    });
    actions.appendChild(b);
    return b;
  };

  const setReportStatus = async (status) => {
    await updateDoc(doc(db, "reports", r.id), { status });
    r.status = status;
  };

  if (!revGone && !hidden && r.status === "new") {
    btn("Hide review", "btn-reject", async () => {
      await updateDoc(doc(db, "communities", r.communityId, "reviews", r.reviewId), { hidden: true });
      await setReportStatus("actioned");
      result.className = "qresult ok";
      result.textContent = "Review hidden — removed from public view and the score recomputes on its next write. Report closed.";
      actions.remove();
      toast("Review hidden");
    });
  }
  if (!revGone && hidden) {
    btn("Unhide review", "btn-approve", async () => {
      await updateDoc(doc(db, "communities", r.communityId, "reviews", r.reviewId), { hidden: false });
      result.className = "qresult ok";
      result.textContent = "Review restored to public view.";
      actions.remove();
      toast("Review restored");
    });
  }
  if (r.status === "new") {
    btn("Dismiss report", "", async () => {
      await setReportStatus("dismissed");
      result.className = "qresult ok";
      result.textContent = "Dismissed — review stays up.";
      actions.remove();
      toast("Report dismissed");
    });
  }
  if (!actions.children.length) actions.remove();
  return card;
}

$("u-refresh").addEventListener("click", () => loadUsers(true));
$("u-search").addEventListener("input", () => renderUsers());

async function loadUsers(force = false) {
  const list = $("users-list");
  if (_users !== null && !force) { renderUsers(); return; }
  list.innerHTML = `<div class="empty glass">Loading users…</div>`;
  try {
    const res = await listUsersFn({});
    _users = (res.data && res.data.users) || [];
    _users.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    renderUsers();
  } catch (e) {
    list.innerHTML = `<div class="notice">Couldn't load users: ${esc(e.message || e.code)}</div>`;
  }
}

const fmtDate = (s) => {
  if (!s) return "—";
  const d = new Date(s);
  return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
};

const geoText = (g) => {
  if (!g) return "";
  const inUS = (g.countryCode || "") === "US";
  const parts = inUS
    ? [g.city, g.regionCode || g.region]
    : [g.city, g.country];
  return parts.filter(Boolean).join(", ");
};
const geoPill = (g) => {
  const t = geoText(g);
  return t ? `<span class="ub no">📍 ${esc(t)}</span>` : "";
};
const communityPill = (v) => {
  if (!v || !v.communityName) return "";
  const cls = v.status === "approved" ? "ok" : v.status === "rejected" ? "no" : "warn";
  return `<span class="ub ${cls}">🏢 ${esc(v.communityName)}</span>`;
};

function renderUsers() {
  const list = $("users-list");
  const q = $("u-search").value.trim().toLowerCase();
  const rows = (_users || []).filter((u) =>
    !q ||
    (u.name || "").toLowerCase().includes(q) ||
    (u.email || "").toLowerCase().includes(q) ||
    (u.phone || "").toLowerCase().includes(q) ||
    geoText(u.signupGeo).toLowerCase().includes(q) ||
    ((u.verification && u.verification.communityName) || "").toLowerCase().includes(q) ||
    u.uid.toLowerCase().includes(q)
  );
  $("c-users").textContent = rows.length + (q ? ` / ${_users.length}` : "");
  if (!rows.length) {
    list.innerHTML = `<div class="empty glass">${q ? "No users match that filter." : "No users yet."}</div>`;
    return;
  }
  list.innerHTML = "";
  for (const u of rows) {
    const card = document.createElement("div");
    card.className = "ucard glass";
    const isAdminUser = u.claims && (u.claims.admin === true || u.claims.role === "admin");
    const avatar = u.photoUrl
      ? `<img src="${esc(u.photoUrl)}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(initials(u.name || u.email))}'))" />`
      : esc(initials(u.name || u.email));
    card.innerHTML = `
      <div class="uhead">
        <div class="uavatar">${avatar}</div>
        <div class="umain">
          <div class="uname">${esc(u.name || "(no name)")}
            ${isAdminUser ? '<span class="ub admin">ADMIN</span>' : ""}
            ${u.disabled ? '<span class="ub off">DISABLED</span>' : ""}
          </div>
          <div class="uemail">${esc(u.email || "(no email)")}${u.phone ? " · " + esc(u.phone) : ""}</div>
        </div>
        <div class="utimes">
          joined <b>${fmtDate(u.createdAt)}</b><br/>
          last seen <b>${fmtDate(u.lastSignInAt)}</b>
        </div>
      </div>
      <div class="ubadges">
        <span class="ub ${u.emailVerified ? "ok" : "warn"}">${u.emailVerified ? "✓" : "○"} email</span>
        <span class="ub ${u.identityVerified ? "ok" : "no"}">${u.identityVerified ? "✓" : "○"} identity</span>
        <span class="ub ${u.residencyVerified ? "ok" : "no"}">${u.residencyVerified ? "✓" : "○"} residency</span>
        ${geoPill(u.signupGeo)}
        ${communityPill(u.verification)}
        <span class="ub no">${u.reviewsPublished} ${u.reviewsPublished === 1 ? "review" : "reviews"}</span>
      </div>
      <div class="udetail">
        <dl class="kv">
          <dt>uid</dt><dd class="mono">${esc(u.uid)}</dd>
          <dt>email</dt><dd>${esc(u.email || "—")}</dd>
          <dt>phone</dt><dd>${esc(u.phone || "—")}</dd>
          <dt>location</dt><dd>${esc(geoText(u.signupGeo) || "— (captured on their next app visit)")}</dd>
          <dt>community</dt><dd>${u.verification ? esc(u.verification.communityName || "—") + " · " + esc(u.verification.status || "") : "—"}</dd>
          <dt>claims</dt><dd class="mono">${esc(JSON.stringify(u.claims || {}))}</dd>
          <dt>created</dt><dd>${esc(u.createdAt || "—")}</dd>
          <dt>last sign-in</dt><dd>${esc(u.lastSignInAt || "—")}</dd>
        </dl>
      </div>`;
    card.addEventListener("click", (e) => {
      if (window.getSelection().toString()) return; // don't toggle while copying
      card.classList.toggle("open");
    });
    list.appendChild(card);
  }
}

$("lightbox").addEventListener("click", () => $("lightbox").classList.remove("open"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("lightbox").classList.remove("open"); });
</script>
