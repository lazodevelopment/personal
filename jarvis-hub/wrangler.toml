name = "jarvis-hub"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Personal command hub for Jesse: Atavia, Elizabeth Scott, Lazo, Roven, LeaseReputation.
# Secret: `npx wrangler secret put HUB_KEY` (the access key for the page and the write API).

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.json"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.mp3"]
fallthrough = true

[[kv_namespaces]]
binding = "HUB"
id = "1592670000454ad4b1cfe3967d837f37"

[triggers]
crons = ["* * * * *", "*/5 * * * *", "0 * * * *"]

[vars]
ALLOWED_EMAILS = "jesse@briskhealth.com"
TZ = "America/Chicago"
BRIEF_HOURS = "5:morning,12:afternoon,18:evening"   # local hours and slots for the daily briefs
TEAMS = "DAL,NE,TEX,COL,BOS,ARI"   # ESPN abbreviations: Cowboys, Patriots, Rangers, Rockies, Red Sox, Diamondbacks
LEAGUES = "nfl,mlb"
CHAT_MODEL = "opus"                # everything on Opus 5.5 (Jesse, 2026-10-16); "sonnet" switches chat back to Sonnet 5.5 for speed
# Secrets (bash deploy.sh secret NAME): HUB_KEY (login key, .hub-login-key), FEED_KEY (feeders/bridges/executor, .hub-key), SESSION_SECRET,
#   ANTHROPIC_API_KEY, ELEVENLABS_API_KEY, GOOGLE_CLIENT_ID, PUSHOVER_USER, PUSHOVER_TOKEN, TWILIO_* (optional), CAL_ICS_URL (optional)
# Optional vars: ELEVENLABS_VOICE_ID
