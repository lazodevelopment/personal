name = "jarvis-hub"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Personal command hub for Jesse: Atavia, Elizabeth Scott, Lazo, Roven, LeaseReputation.
# Secret: `npx wrangler secret put HUB_KEY` (the access key for the page and the write API).

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.json"]
fallthrough = true

[[kv_namespaces]]
binding = "HUB"
id = "1592670000454ad4b1cfe3967d837f37"

[triggers]
crons = ["*/5 * * * *", "0 * * * *"]

[vars]
ALLOWED_EMAILS = "jesse@briskhealth.com"
ALERT_EMAIL = "jesse@briskhealth.com"
TZ = "America/Chicago"
BRIEF_HOURS = "5:morning,12:afternoon,18:evening"   # local hours and slots for the daily briefs
TEAMS = "DAL,NE,TEX,COL,BOS,ARI"   # ESPN abbreviations: Cowboys, Patriots, Rangers, Rockies, Red Sox, Diamondbacks
LEAGUES = "nfl,mlb"
CHAT_MODEL = "sonnet"              # conversation on Sonnet 5.5 (no thinking step) for speed; briefs stay on Opus
NTFY_TOPIC = "jarvis-a52b945267dd"
