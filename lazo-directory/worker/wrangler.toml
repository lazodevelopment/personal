name = "lazo-site"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Custom domain: add meetlazo.com route in Cloudflare dash after first deploy,
# or uncomment once the zone is on the account:
# routes = [{ pattern = "meetlazo.com", custom_domain = true }]

[[r2_buckets]]
binding = "SITE"
bucket_name = "lazo-site"

# JC-LAZO-GALLERY-0911-005: post-wedding delivery galleries live in their own
# bucket so deploy_site.py's prune can never touch client photos.
# JC-LAZO-WORKER-0929-LIVE-001: /api/translate runs m2m100 on Workers AI
[ai]
binding = "AI"

[[r2_buckets]]
binding = "GALLERIES"
bucket_name = "lazo-galleries"

# JC-LAZO-PRINTS-0920-001: the print store. Secrets go in with `wrangler secret put`:
#   WHCC_EDITOR_KEY WHCC_EDITOR_SECRET WHCC_OS_KEY WHCC_OS_SECRET
#   STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PRINTS_ADMIN_KEY (and GALLERY_SECRET, already set)
[vars]
CALL_EVENT_URL = "https://us-central1-lazo-513ec.cloudfunctions.net/callEvent"   # JC-LAZO-CALLS-1016: the call log
# JC-LAZO-WORKER-0930-FSAUTH: the worker signs in to Firestore (see src/fsauth.js); WORKER_TOKEN_KEY is a secret
FIREBASE_API_KEY = "AIzaSyD2EdP1wD-DaaZdS9Cdc4rXv_QeL3XdxbU"
WORKER_TOKEN_URL = "https://us-central1-lazo-513ec.cloudfunctions.net/workerToken"
WHCC_ENV = "sandbox"          # "production" when the live credential set is in
PRINT_MARKUP = "100"          # percent over WHCC wholesale, shown to the couple
PRINT_FROM_NAME = "Lazo Weddings"
PRINT_FROM_ADDR1 = ""         # the return address printed on the label (US street address, no PO box)
PRINT_FROM_ADDR2 = ""
PRINT_FROM_CITY = ""
PRINT_FROM_STATE = ""
PRINT_FROM_ZIP = ""

# JC-LAZO-CALLS-1016-WORKER-001: Lazo video calls. One CallRoom Durable Object per call (src/rt.js).
# Secrets (wrangler secret put): CF_REALTIME_APP_ID, CF_REALTIME_APP_SECRET (the "lazo-video" SFU app),
# CALL_TOKEN_SECRET (the same value as the Firebase secret CALL_TOKEN_SECRET; callJoin signs, the worker checks).
[[durable_objects.bindings]]
name = "CALL_ROOM"
class_name = "CallRoom"

[[migrations]]
tag = "v1-callroom"
new_sqlite_classes = ["CallRoom"]
