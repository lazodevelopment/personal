name = "june-hub"
main = "src/index.js"
compatibility_date = "2026-07-01"

# June: every Lazo vendor's own assistant hub (brief read aloud, weather, local news,
# who is waiting, this week's weddings, money, the page, and a streaming chat with hands).
# Vendors sign in with their Lazo login; the worker reads and writes Firestore AS THEM,
# so the security rules decide what June can see. Nothing here holds a vendor credential.
#
# Secrets (npx wrangler secret put NAME): ANTHROPIC_API_KEY, ELEVENLABS_API_KEY
# Custom domain (later, in the Cloudflare dash): june.meetlazo.com

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[kv_namespaces]]
binding = "JUNE"
id = "857b7d96321a495a897c3898fdf3b75a"

# Every 15 minutes: 7am briefs (and the Monday review), two-hour lead nudges, due reminders, for vendors
# who turned alerts on. Needs secrets JUNE_SECRET (encrypts their refresh tokens at rest) and
# RESEND_API_KEY (same key the Lazo functions use; hello@meetlazo.com is verified there).
[triggers]
crons = ["*/15 * * * *"]

[vars]
PUBLIC_URL = "https://june-hub.floral-credit-e4f0.workers.dev"
EMAIL_FROM = "June at Lazo <hello@meetlazo.com>"
FIREBASE_API_KEY = "AIzaSyD2EdP1wD-DaaZdS9Cdc4rXv_QeL3XdxbU"   # the public web key of lazo-513ec (same as the site worker)
JUNE_VOICE_ID = "pFZP5JQG7iQjIQuC4Bku"                        # ElevenLabs "Lily": warm, British
CHAT_MODEL = "claude-sonnet-5-5"
BRIEF_MODEL = "claude-sonnet-5-5"
APP_URL = "https://app.meetlazo.com/dashboard"
# June Studio social posting (Ayrshare Business plan, one profile per vendor). Leave empty until the
# account exists; the Social panel then says "not configured". Secrets: AYRSHARE_API_KEY,
# AYRSHARE_PRIVATE_KEY (the PEM from Ayrshare -> Profiles -> Generate JWT). Domain is the Ayrshare one.
AYRSHARE_DOMAIN = ""
